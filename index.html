function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { checked: {}, bookStatus: {}, streakStart: null };
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

function getTodayKey() {
  return new Date().toISOString().split("T")[0];
}

function App() {
  const [activeTab, setActiveTab] = useState(0);
  const todayName = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];

  const [expandedPhase, setExpandedPhase] = useState(0);

  const checked = data.checked || {};
  const bookStatus = data.bookStatus || {};

    setData(prev => {
      const next = fn(prev);
      saveData(next);
      return next;
    });
  }, []);

  const toggleCheck = (id) => {
    const dayKey = getTodayKey();
    update(prev => ({
      ...prev,
      checked: { ...prev.checked, [`${dayKey}:${id}`]: !prev.checked[`${dayKey}:${id}`] }
    }));
  };

  const isChecked = (id) => {
    const dayKey = getTodayKey();
    return !!checked[`${dayKey}:${id}`];
  };

  const resetDay = () => {
    const dayKey = getTodayKey();
    const dayBlocks = schedule[selectedDay].blocks.map(b => b.id);
    update(prev => {
      const next = { ...prev, checked: { ...prev.checked } };
      dayBlocks.forEach(id => delete next.checked[`${dayKey}:${id}`]);
      return next;
    });
  };

  const cycleBook = (title) => {
    const states = ["unread", "reading", "done"];
    const current = bookStatus[title] || "unread";
    const idx = states.indexOf(current);
    const next = states[(idx + 1) % 3];
    update(prev => ({ ...prev, bookStatus: { ...prev.bookStatus, [title]: next } }));
  };

  const dayNames = Object.keys(schedule);
  const dayData = schedule[selectedDay];
  const dayKey = getTodayKey();
  const dayCheckedCount = dayData.blocks.filter(b => checked[`${dayKey}:${b.id}`]).length;
  const dayTotal = dayData.blocks.length;
  const isToday = selectedDay === todayName;

  const getStreak = () => {
    let streak = 0;
    const d = new Date();
    for (let i = 1; i <= 365; i++) {
      d.setDate(d.getDate() - (i === 1 ? 1 : 1));
      const key = d.toISOString().split("T")[0];
      const dayName = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];
      if (dayName === "Sunday") { streak++; continue; }
      const blocks = schedule[dayName].blocks;
      const studyBlocks = blocks.filter(b => ["math","python","market"].includes(b.type));
      const doneCount = studyBlocks.filter(b => checked[`${key}:${b.id}`]).length;
      if (doneCount >= Math.ceil(studyBlocks.length * 0.5)) { streak++; } else { break; }
    }
    return streak;
  };

  ];

              style={{
                flex: 1, background: "none", border: "none", padding: "10px 0",
                color: activeTab === i ? "var(--gold)" : "var(--text4)",
                fontSize: 12, fontWeight: activeTab === i ? 600 : 400,
                borderBottom: activeTab === i ? "2px solid var(--gold)" : "2px solid transparent",
                fontFamily: "var(--sans)", transition: "all 0.2s",
              }}
            ><span style={{ marginRight: 6, fontSize: 10 }}>{tab.icon}</span>{tab.label}</button>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 600, margin: "0 auto", padding: "0 20px 100px" }}>

        {/* SCHEDULE TAB */}
        {activeTab === 0 && (
          <div className="fade-in" style={{ paddingTop: 16 }}>
            {/* Day pills */}
            <div style={{ display: "flex", gap: 4, marginBottom: 16, overflowX: "auto", paddingBottom: 4 }}>
              {dayNames.map(d => {
                const isActive = d === selectedDay;
                const isT = d === todayName;
                const blocks = schedule[d].blocks;
                const dk = getTodayKey();
                const dc = isT ? blocks.filter(b => checked[`${dk}:${b.id}`]).length : 0;
                const allDone = isT && dc === blocks.length && blocks.length > 0;
                return (
                  <button key={d} onClick={() => setSelectedDay(d)}
                    style={{
                      flex: "1 0 auto", minWidth: 42, padding: "8px 6px",
                      background: isActive ? "var(--surface)" : "transparent",
                      border: isActive ? "1px solid var(--border2)" : isT ? "1px solid var(--border)" : "1px solid transparent",
                      borderRadius: 8, fontSize: 11, fontFamily: "var(--mono)",
                      color: allDone ? "var(--green)" : isActive ? "var(--text)" : "var(--text4)",
                      fontWeight: isActive ? 600 : 400, textAlign: "center",
                    }}
                  >{d.slice(0,3)}{isT && <div style={{ width: 4, height: 4, borderRadius: 2, background: "var(--gold)", margin: "3px auto 0" }}/>}</button>
                );
              })}
            </div>

            {/* Day header */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div>
                <h2 style={{ fontSize: 17, fontWeight: 600 }}>{selectedDay}</h2>
                <p style={{ fontSize: 11, color: "var(--text3)", fontFamily: "var(--mono)" }}>{dayData.subtitle}</p>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                {isToday && <span style={{ fontSize: 11, color: "var(--text4)", fontFamily: "var(--mono)" }}>{dayCheckedCount}/{dayTotal}</span>}
                {isToday && (
                  <button onClick={resetDay}
                    style={{ background: "none", border: "1px solid var(--border2)", borderRadius: 6, color: "var(--text4)", fontSize: 10, padding: "3px 8px", fontFamily: "var(--mono)" }}
                  >RESET</button>
                )}
              </div>
            </div>

            {/* Blocks */}
            <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
              {dayData.blocks.map((block, bi) => {
                const done = isToday && isChecked(block.id);
                const clr = COLORS[block.type];
                return (
                  <div key={block.id}
                    onClick={() => isToday && toggleCheck(block.id)}
                    style={{
                      display: "flex", gap: 10, padding: "11px 12px",
                      background: done ? "var(--surface2)" : "var(--surface)",
                      borderRadius: 8, cursor: isToday ? "pointer" : "default",
                      borderLeft: `3px solid ${done ? "var(--text6)" : clr}`,
                      opacity: done ? 0.45 : 1, transition: "all 0.15s",
                      animation: `fadeIn 0.2s ease ${bi * 0.03}s both`,
                    }}
                  >
                    {isToday && (
                      <div className={done ? "check-pop" : ""} style={{
                        width: 17, height: 17, borderRadius: 4, flexShrink: 0, marginTop: 1,
                        border: done ? "2px solid var(--green)" : "2px solid var(--text6)",
                        background: done ? "var(--green)" : "transparent",
                        display: "flex", alignItems: "center", justifyContent: "center",
                        fontSize: 10, color: "var(--bg)", fontWeight: 700,
                      }}>{done && "✓"}</div>
                    )}
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 2, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 8, fontWeight: 600, color: clr, letterSpacing: "0.5px", fontFamily: "var(--mono)" }}>{LABELS[block.type]}</span>
                        <span style={{ fontSize: 10, color: "var(--text5)", fontFamily: "var(--mono)" }}>{block.time}</span>
                      </div>
                      <p style={{ fontSize: 13, fontWeight: 500, color: done ? "var(--text4)" : "var(--text)", textDecoration: done ? "line-through" : "none", marginBottom: block.detail ? 2 : 0 }}>{block.task}</p>
                      {block.detail && <p style={{ fontSize: 11, color: "var(--text3)", lineHeight: 1.4 }}>{block.detail}</p>}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Weekly totals */}
            <div style={{ marginTop: 24, padding: "14px 12px", background: "var(--surface)", borderRadius: 8, border: "1px solid var(--border)" }}>
              <h3 style={{ fontSize: 10, fontWeight: 600, color: "var(--text3)", letterSpacing: "0.5px", fontFamily: "var(--mono)", marginBottom: 10 }}>WEEKLY TOTALS</h3>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 20px" }}>
                {Object.entries(weeklyTotals).map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between" }}>
                    <span style={{ fontSize: 11, color: COLORS[k] || "var(--text3)", fontWeight: 500 }}>{k.charAt(0).toUpperCase()+k.slice(1)}</span>
                    <span style={{ fontSize: 10, color: "var(--text4)", fontFamily: "var(--mono)" }}>{v}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Split */}
            <div style={{ marginTop: 8, padding: "12px", background: "var(--surface)", borderRadius: 8, border: "1px solid var(--border)" }}>
              <h3 style={{ fontSize: 10, fontWeight: 600, color: "var(--green)", letterSpacing: "0.5px", fontFamily: "var(--mono)", marginBottom: 8 }}>WEEKLY SPLIT</h3>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
                {splitDays.map(d => (
                  <div key={d.day} style={{ padding: "6px 2px", background: "var(--surface2)", borderRadius: 5, textAlign: "center" }}>
                    <div style={{ fontSize: 9, color: "var(--text4)", fontFamily: "var(--mono)", marginBottom: 3 }}>{d.day}</div>
                    {d.lift && <div style={{ fontSize: 10, color: "var(--green)", fontWeight: 600 }}>{d.lift}</div>}
                    {d.cardio && <div style={{ fontSize: 9, color: d.cardio === "Rest" ? "var(--text5)" : "var(--blue)" }}>{d.cardio}</div>}
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ROADMAP TAB */}
        {activeTab === 1 && (
          <div className="fade-in" style={{ paddingTop: 16 }}>
            {phases.map((phase, pi) => {
              const isOpen = expandedPhase === pi;
              return (
                <div key={pi} style={{ marginBottom: 10 }}>
                  <div onClick={() => setExpandedPhase(isOpen ? -1 : pi)}
                    style={{
                      padding: "12px 14px", background: "var(--surface)",
                      borderRadius: isOpen ? "8px 8px 0 0" : 8,
                      cursor: "pointer", borderLeft: `3px solid ${phase.color}`,
                      display: "flex", justifyContent: "space-between", alignItems: "center",
                    }}
                  >
                    <div>
                      <h3 style={{ fontSize: 14, fontWeight: 600, color: phase.color, marginBottom: 1 }}>{phase.name}</h3>
                      <p style={{ fontSize: 10, color: "var(--text3)", fontFamily: "var(--mono)" }}>{phase.months}</p>
                    </div>
                    <span style={{ fontSize: 16, color: "var(--text5)", transform: isOpen ? "rotate(90deg)" : "none", transition: "0.2s" }}>›</span>
                  </div>
                  {isOpen && (
                    <div className="fade-in" style={{ background: "var(--surface2)", borderRadius: "0 0 8px 8px", padding: "14px", borderLeft: `3px solid ${phase.color}` }}>
                      {phase.tracks.map((t, ti) => (
                        <div key={ti} style={{ marginBottom: 12, paddingBottom: 12, borderBottom: ti < phase.tracks.length - 1 ? "1px solid var(--border)" : "none" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 3 }}>
                            <span style={{ fontSize: 13 }}>{t.icon}</span>
                            <span style={{ fontSize: 12, fontWeight: 600 }}>{t.label}</span>
                          </div>
                          <p style={{ fontSize: 11, color: "var(--text2)", lineHeight: 1.5, paddingLeft: 20 }}>{t.detail}</p>
                        </div>
                      ))}
                      <div style={{ marginTop: 6, padding: "10px", background: "var(--surface)", borderRadius: 6 }}>
                        <h4 style={{ fontSize: 9, fontWeight: 600, color: "var(--gold)", letterSpacing: "0.5px", fontFamily: "var(--mono)", marginBottom: 6 }}>MILESTONES</h4>
                        {phase.milestones.map((m, mi) => (
                          <div key={mi} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                            <span style={{ color: "var(--text5)", fontSize: 10 }}>◇</span>
                            <span style={{ fontSize: 11, color: "#BBB" }}>{m}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}

            <div style={{ marginTop: 16, padding: "12px 14px", background: "var(--surface)", borderRadius: 8, borderLeft: "3px solid var(--coral)" }}>
              <h4 style={{ fontSize: 10, fontWeight: 600, color: "var(--coral)", letterSpacing: "0.5px", fontFamily: "var(--mono)", marginBottom: 6 }}>DON'T FORGET</h4>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <p style={{ fontSize: 11, color: "var(--text2)", lineHeight: 1.5 }}><strong style={{ color: "#CCC" }}>60-second trade pitch.</strong> By month 6, pitch your weekly thesis in under 60 seconds.</p>
                <p style={{ fontSize: 11, color: "var(--text2)", lineHeight: 1.5 }}><strong style={{ color: "#CCC" }}>Mental math.</strong> Zetamac 10 min/day starting month 7.</p>
                <p style={{ fontSize: 11, color: "var(--text2)", lineHeight: 1.5 }}><strong style={{ color: "#CCC" }}>Cross-product.</strong> By month 9: rates, credit, FX, commodities conversational fluency.</p>
              </div>
            </div>
          </div>
        )}

        {/* BOOKS TAB */}
        {activeTab === 2 && (
          <div className="fade-in" style={{ paddingTop: 16 }}>
            {readingList.map((cat, ci) => (
              <div key={ci} style={{ marginBottom: 20 }}>
                <h3 style={{ fontSize: 10, fontWeight: 600, color: "var(--text3)", letterSpacing: "0.5px", fontFamily: "var(--mono)", marginBottom: 10 }}>{cat.category.toUpperCase()}</h3>
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  {cat.books.map(book => {
                    const status = bookStatus[book.title] || "unread";
                    const clrs = { unread: "var(--text5)", reading: "var(--gold)", done: "var(--green)" };
                    const lbls = { unread: "—", reading: "READING", done: "DONE" };
                    return (
                      <div key={book.title} onClick={() => cycleBook(book.title)}
                        style={{
                          padding: "10px 12px", background: "var(--surface)", borderRadius: 8, cursor: "pointer",
                          borderLeft: `3px solid ${clrs[status]}`, opacity: status === "done" ? 0.55 : 1,
                        }}
                      >
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                          <div>
                            <span style={{ fontSize: 13, fontWeight: 500, textDecoration: status === "done" ? "line-through" : "none", color: status === "done" ? "var(--text3)" : "var(--text)" }}>{book.title}</span>
                            <span style={{ fontSize: 11, color: "var(--text3)", marginLeft: 6 }}>— {book.author}</span>
                          </div>
                          <span style={{ fontSize: 8, fontWeight: 600, color: clrs[status], fontFamily: "var(--mono)", whiteSpace: "nowrap", marginLeft: 10 }}>{lbls[status]}</span>
                        </div>
                        <div style={{ display: "flex", gap: 10, marginTop: 3, flexWrap: "wrap" }}>
                          <span style={{ fontSize: 10, color: "var(--text4)", fontFamily: "var(--mono)" }}>{book.when}</span>
                          <span style={{ fontSize: 10, color: "var(--text3)" }}>{book.why}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
            <p style={{ fontSize: 10, color: "var(--text5)", fontStyle: "italic" }}>Tap to cycle: unread → reading → done</p>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
